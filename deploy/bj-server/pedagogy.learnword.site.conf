server {
    listen 80;
    listen [::]:80;
    server_name pedagogy.learnword.site;

    location ^~ /.well-known/acme-challenge/ {
        root /www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://pedagogy.learnword.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pedagogy.learnword.site;
    ssl_certificate /usr/local/openresty/nginx/conf/ssl/pedagogy-fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/pedagogy-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
